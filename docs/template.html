<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>$title$ -- MICELIO</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f2ec;--fg:#1a0f0a;--fg2:#5c4a3a;--fg3:#8c7a6a;--accent:#b85c3a;--accent2:rgba(184,92,58,0.08);--accent3:#c9852a;--code-bg:#1a0f0a;--code-fg:#e6d4c0;--border:rgba(184,92,58,0.1);--border2:rgba(184,92,58,0.2);--r:12px;--r2:6px;--font:system-ui,-apple-system,Segoe UI,Roboto,Helvetica Neue,sans-serif;--font-display:Georgia,Times New Roman,serif;--font-mono:Cascadia Code,JetBrains Mono,Fira Code,Consolas,monospace}
[data-theme="dark"]{--bg:#14100c;--fg:#e6ddd4;--fg2:#b8a898;--fg3:#887a6a;--accent:#d4835a;--accent2:rgba(212,131,90,0.12);--accent3:#d4a030;--code-bg:#0d0906;--code-fg:#e6ddd4;--border:rgba(212,131,90,0.12);--border2:rgba(212,131,90,0.22)}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.7;margin:0;padding:2rem 1.5rem 5rem;max-width:860px;margin-left:auto;margin-right:auto}
h1{font-family:var(--font-display);font-size:2.5rem;font-weight:700;margin:0 0 0.3rem;color:var(--accent);line-height:1.2}
h2{font-size:1.4rem;font-weight:700;margin:2.5rem 0 0.75rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
h3{font-size:1.1rem;font-weight:600;margin:1.8rem 0 0.5rem;color:var(--accent3)}
h4{font-size:1rem;font-weight:600;margin:1.5rem 0 0.5rem;color:var(--fg2)}
p{margin:0 0 1rem}
a{color:var(--accent)}
a:hover{text-decoration:underline}
ul,ol{margin:0 0 1.5rem 1.5rem}
li{margin-bottom:0.3rem}
code{font-family:var(--font-mono);font-size:0.85em;background:var(--accent2);color:var(--accent);padding:0.1rem 0.5rem;border-radius:4px}
pre{background:var(--code-bg);color:var(--code-fg);padding:1.25rem 1.5rem;border-radius:var(--r);overflow-x:auto;font-family:var(--font-mono);font-size:0.85rem;line-height:1.6;margin:0 0 1.5rem}
pre code{background:transparent;color:inherit;padding:0;font-size:inherit}
blockquote{border-left:3px solid var(--accent);background:var(--accent2);padding:0.75rem 1.25rem;margin:0 0 1.5rem;border-radius:0 var(--r2) var(--r2) 0;color:var(--fg2)}
hr{border:none;border-top:1px solid var(--border);margin:2rem 0}
table{width:100%;border-collapse:collapse;margin:0 0 1.5rem;font-size:0.9rem}
th,td{border:1px solid var(--border);padding:0.5rem 0.75rem;text-align:left}
th{background:var(--accent2);font-weight:600}
.mermaid{background:#ece8e2;border-radius:var(--r);padding:12px;margin:0 0 1.5rem;overflow-x:auto;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.top a{font-size:0.9rem;color:var(--fg3);padding:0.3rem 0.8rem;border:1px solid var(--border);border-radius:var(--r2);text-decoration:none}
.top a:hover{background:var(--accent2);color:var(--accent)}
.menu-btn{background:none;border:none;color:var(--fg2);font-size:1.3rem;cursor:pointer;padding:0.2rem 0.4rem;border-radius:var(--r2)}
.menu-btn:hover{background:var(--accent2);color:var(--accent)}
.sidebar{position:fixed;top:0;right:-300px;width:280px;height:100vh;z-index:2000;background:var(--bg);border-left:1px solid var(--border2);padding:4rem 1.5rem 2rem;overflow-y:auto;transition:right .3s ease;box-shadow:-4px 0 20px rgba(0,0,0,0.1)}
.sidebar.open{right:0}
.sidebar h3{font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;color:var(--fg3);margin-bottom:1rem}
.sidebar a{display:block;padding:0.35rem 0.5rem;font-size:0.85rem;color:var(--fg2);text-decoration:none;border-radius:var(--r2)}
.sidebar a:hover{background:var(--accent2);color:var(--accent)}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1999;background:rgba(0,0,0,0.3);opacity:0;pointer-events:none;transition:opacity .3s ease}
.overlay.show{opacity:1;pointer-events:auto}
@media(max-width:600px){body{padding:1.5rem 1rem 4rem}}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
  <h3>Indice</h3>
  <div id="tocLinks"></div>
  <hr style="margin:1.5rem 0;border-color:var(--border)">
  <button class="menu-btn" id="themeBtn" style="font-size:0.85rem;display:flex;align-items:center;gap:0.4rem;width:100%">&#x25D0; Modo oscuro</button>
</div>
<div class="top">
  <a href="../index.html">&larr; Inicio</a>
  <button class="menu-btn" id="menuBtn">&#x2630;</button>
</div>
$body$
<script>
try{(function(){var t;try{t=localStorage.getItem('tema')}catch(e){}if(t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.setAttribute('data-theme','dark')}})()}catch(e){}
try{document.getElementById('themeBtn').onclick=function(){
 var h=document.documentElement;
 if(h.getAttribute('data-theme')==='dark'){h.removeAttribute('data-theme');try{localStorage.setItem('tema','light')}catch(e){}}
 else{h.setAttribute('data-theme','dark');try{localStorage.setItem('tema','dark')}catch(e){}}
}}catch(e){}
try{(function(){
 var hd=document.querySelectorAll('h2,h3,h4');
 var ct=document.getElementById('tocLinks');
 var mb=document.getElementById('menuBtn');
 var sb=document.getElementById('sidebar');
 var ov=document.getElementById('overlay');
 if(!ct||!mb||!sb||!ov)return;
 var s=[];
 for(var i=0;i<hd.length;i++){
  var e=hd[i];var t=e.textContent.trim();
  var id=e.id||t.toLowerCase().replace(/[^a-z0-9\u00f1\u00e1-\u00fa]+/g,'-').replace(/^-+/,'').replace(/-+$$/g,'');
  if(!id)id='s'+i;e.id=id;
  s.push({tag:e.tagName.toLowerCase(),id:id,text:t})
 }
 ct.innerHTML='';
 for(var i=0;i<s.length;i++){
  var a=document.createElement('a');a.href='#'+s[i].id;
  var lvl=s[i].tag==='h2'?'':s[i].tag==='h3'?'  ':'    ';
  a.textContent=lvl+s[i].text;
  a.style.paddingLeft=(s[i].tag==='h3'?'1.5rem':s[i].tag==='h4'?'2.5rem':'0.5rem');
  ct.appendChild(a)
 }
 if(s.length<3){sb.style.display='none';mb.style.display='none';return}
 function closeMenu(){sb.classList.remove('open');ov.classList.remove('show')}
 mb.onclick=function(){sb.classList.toggle('open');ov.classList.toggle('show')}
 ov.onclick=closeMenu;
 document.addEventListener('keydown',function(e){if(e.key==='Escape')closeMenu()})
})()}catch(e){}
</script>
</body>
</html>
